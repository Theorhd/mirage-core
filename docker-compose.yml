services:
  miraged:
    # Pin to a released version tag or immutable `@sha256:<digest>` in production.
    image: ghcr.io/theorhd/mirage-core:v0.3.0
    user: "65534:65534"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp-miraged.json
    # Default bridge isolation: publish host TCP/443 -> container unprivileged 8443.
    # For maximum throughput with zero userland NAT overhead, switch to
    # `network_mode: host` (with CAP_NET_BIND_SERVICE or unprivileged listen port).
    ports:
      - "443:8443/tcp"
    pids_limit: 256
    mem_limit: 512m
    memswap_limit: 512m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      core:
        soft: 0
        hard: 0
    logging:
      driver: none
    secrets:
      - source: miraged_config
        target: config.toml
    restart: unless-stopped

secrets:
  miraged_config:
    # Prepare on host:
    #   install -d -m 0700 ./secrets
    #   install -m 0400 -o 65534 -g 65534 config.toml ./secrets/config.toml
    file: ./secrets/config.toml
